services:
  - type: web
    name: discord-query-forwarder
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.19.4
      - key: DISCORD_WEBHOOK_URL
        sync: false
